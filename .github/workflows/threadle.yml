name: Threadle CI and deployment
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Check the installed baseline without restarting
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: threadle-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  regression:
    name: Regression ${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-app.txt
            deploy/media.json
      - run: python -m pip install -r requirements-app.txt "Pillow==13.0.0"
      - name: Run every test in this partition
        run: python -B deploy/ci.py --tests-only --shard ${{ matrix.shard }} --shards 4 --timings ci-results/shard-${{ matrix.shard }}.json
      - name: Preserve test durations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node.js 24
        with:
          name: ci-timings-${{ matrix.shard }}
          path: ci-results/shard-${{ matrix.shard }}.json
          retention-days: 7
  checks:
    name: Deployment and preview checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate deployment files and Windows recovery
        # PR checkouts are merge commits: first parent is the destination branch.
        # Main pushes likewise retain the immediately preceding installed versions.
        run: python -B deploy/ci.py --checks-only --baseline-ref HEAD^1
      - name: Check runner shell under a restricted execution policy
        run: python -B deploy/test_runner_shell.py
      - name: Check preview playback
        run: node --test deploy/test_preview_clock.cjs
      - name: Package verified deployment inputs
        run: python -B deploy/package_source.py --destination "${{ runner.temp }}/threadle-source-${{ github.run_id }}-${{ github.run_attempt }}" --commit "${{ github.sha }}"
      - name: Preserve deployment inputs for this run
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node.js 24
        with:
          name: threadle-source-${{ github.sha }}
          path: ${{ runner.temp }}/threadle-source-${{ github.run_id }}-${{ github.run_attempt }}/
          # A failed-job rerun may reuse the successful package from an earlier attempt.
          overwrite: true
          if-no-files-found: error
          retention-days: 2
  verify:
    # Preserve the existing required-check name and fail it if any partition fails.
    needs: [regression, checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every regression and deployment check
        env:
          REGRESSION_RESULT: ${{ needs.regression.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          test "$REGRESSION_RESULT" = success
          test "$CHECKS_RESULT" = success
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.THREADLE_CD_ENABLED == 'true'))
    runs-on: [self-hosted, Windows, X64, threadle-production]
    timeout-minutes: 10
    steps:
      # No Git/PowerShell Expand-Archive fallback on the production notebook.
      # This downloads only this workflow run's verified, immutable source artifact.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, Node.js 24
        timeout-minutes: 2
        with:
          name: threadle-source-${{ github.sha }}
          path: ${{ runner.temp }}/threadle-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          digest-mismatch: error
      - name: Apply scoped changes with backup and health checks
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        env:
          PREFLIGHT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.preflight_only || false }}
          THREADLE_SOURCE_ROOT: ${{ runner.temp }}/threadle-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          THREADLE_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceCommit = (Get-Content -LiteralPath (Join-Path $env:THREADLE_SOURCE_ROOT 'source-commit.txt') -Raw).Trim()
          if ($sourceCommit -ne $env:THREADLE_SOURCE_COMMIT) { throw 'Deployment artifact commit mismatch' }
          $deployScript = Join-Path $env:THREADLE_SOURCE_ROOT 'deploy\deploy.ps1'
          if ($env:PREFLIGHT_ONLY -eq 'true') {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $deployScript -PreflightOnly
          } else {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $deployScript
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
