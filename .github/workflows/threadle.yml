name: Threadle CI and deployment
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Check the installed baseline without restarting
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: threadle-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-app.txt "Pillow==13.0.0"
      - name: Regression tests and deployment file checks
        run: python -B deploy/ci.py
      - name: Check runner shell under a restricted execution policy
        run: python -B deploy/test_runner_shell.py
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.THREADLE_CD_ENABLED == 'true'))
    runs-on: [self-hosted, Windows, X64, threadle-production]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Apply scoped changes with backup and health checks
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        env:
          PREFLIGHT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.preflight_only || false }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PREFLIGHT_ONLY -eq 'true') {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\deploy\deploy.ps1 -PreflightOnly
          } else {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\deploy\deploy.ps1
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
